<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#0066cc" opacity="0.1"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#0066cc" stroke-width="2"/>

  <!-- Letter "B" stylized -->
  <text x="100" y="130" font-size="80" font-weight="bold" fill="#0066cc" text-anchor="middle" font-family="Arial, sans-serif">B</text>

  <!-- Small accent dot -->
  <circle cx="140" cy="70" r="8" fill="#00a3e0"/>
  
  <!-- Corner accent -->
  <line x1="30" y1="30" x2="50" y2="30" stroke="#ff6b35" stroke-width="3"/>
  <line x1="30" y1="30" x2="30" y2="50" stroke="#ff6b35" stroke-width="3"/>
</svg>
