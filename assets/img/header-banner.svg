<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a3e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="#f8f9fa"/>
  
  <!-- Main title area -->
  <text x="200" y="80" font-size="48" font-weight="bold" fill="url(#grad1)" text-anchor="middle" font-family="Arial, sans-serif">Burak Çokluk</text>
  
  <!-- Subtitle -->
  <text x="200" y="130" font-size="24" fill="#666" text-anchor="middle" font-family="Arial, sans-serif">System & Network Engineer</text>
  
  <!-- Divider -->
  <line x1="80" y1="150" x2="320" y2="150" stroke="#0066cc" stroke-width="2"/>
  
  <!-- Skills highlight -->
  <text x="200" y="190" font-size="14" fill="#00a3e0" text-anchor="middle" font-family="Arial, sans-serif">DevOps | Infrastructure | AI | Web3</text>
  
  <!-- Corner accents -->
  <circle cx="20" cy="20" r="4" fill="#ff6b35"/>
  <circle cx="380" cy="230" r="4" fill="#ff6b35"/>
</svg>
