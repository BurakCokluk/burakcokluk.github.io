<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body>
    {% include header.html %}
    <main>
      <div class="page-content">
        <h1>Blog</h1>
        {% if site.posts %}
          <div class="blog-posts">
            {% for post in site.posts %}
              <article>
                <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
                <p>{{ post.excerpt }}</p>
                <a href="{{ post.url }}">Read more</a>
              </article>
            {% endfor %}
          </div>
        {% else %}
          <p>No blog posts yet.</p>
        {% endif %}
      </div>
    </main>
    {% include footer.html %}
  </body>
</html>
