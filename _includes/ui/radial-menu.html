<!-- Radial Navigation Menu -->
<div class="radial-menu-container">
  <button class="radial-menu-toggle" aria-label="Toggle navigation menu" id="radialMenuToggle">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="1"></circle>
      <circle cx="19" cy="12" r="1"></circle>
      <circle cx="5" cy="12" r="1"></circle>
    </svg>
  </button>

  <div class="radial-menu-content" id="radialMenuContent">
    <nav class="radial-menu-nav" id="radialMenuNav">
    </nav>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const toggle = document.getElementById('radialMenuToggle');
  const content = document.getElementById('radialMenuContent');
  const nav = document.getElementById('radialMenuNav');
  let links = [];
  // Central icon registry keeps SVG markup consistent and easy to tweak.
  const iconMap = {
    home: `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon icon-home">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M9 22v-6h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    `,
    about: `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon icon-about">
        <circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle>
        <path d="M5 21v-2a7 7 0 0 1 14 0v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    `,
    projects: `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon icon-projects">
        <path d="M3 7h18v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M3 11h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
      </svg>
    `,
    blog: `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon icon-blog">
        <path d="M4 4h6a2 2 0 0 1 2 2v14H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M14 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M8 8h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        <path d="M8 12h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        <path d="M16 8h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        <path d="M16 12h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
      </svg>
    `,
    skills: `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon icon-skills">
        <path d="M12 2v7l4 2-4 11-1-7-5-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    `,
    tools: `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon icon-tools">
        <path d="m21 3-6.6 6.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M21 3a4 4 0 0 1-5.7 5.7L9 15V9l6.3-6.3A4 4 0 0 1 21 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="m9 18-3 3-2-2 3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    `,
    ai: `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon icon-ai">
        <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></rect>
        <rect x="9" y="9" width="6" height="6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></rect>
        <path d="M9 2v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        <path d="M15 2v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        <path d="M9 20v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        <path d="M15 20v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        <path d="M20 9h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        <path d="M20 15h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        <path d="M2 9h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        <path d="M2 15h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
      </svg>
    `,
    resume: `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon icon-resume">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M14 2v6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M9 13h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        <path d="M9 17h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        <path d="M9 9h1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
      </svg>
    `,
    contact: `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon icon-mail">
        <rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></rect>
        <path d="m22 6-10 7L2 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    `
  };

  // Update this list to control radial menu destinations and the icon key each item uses.
  const menuItems = [
    { label: 'Home', href: '/', icon: 'home' },
    { label: 'About', href: '/about/', icon: 'about' },
    { label: 'Projects', href: '/projects/', icon: 'projects' },
    { label: 'Blog', href: '/blog/', icon: 'blog' },
    { label: 'Skills', href: '/skills/', icon: 'skills' },
    { label: 'Tools', href: '/tools/', icon: 'tools' },
    { label: 'AI Projects', href: '/ai-projects/', icon: 'ai' },
    { label: 'Resume', href: '/resume/', icon: 'resume' },
    { label: 'Contact', href: '/contact/', icon: 'contact' }
  ];
  let isOpen = false;

  function renderMenu(items) {
    nav.innerHTML = '';
    items.forEach((item, index) => {
      const link = document.createElement('a');
      link.className = 'radial-menu-link';
      link.href = item.href;
      link.setAttribute('data-index', index);
      link.setAttribute('data-label', item.label);
      link.setAttribute('aria-label', item.label);
      if (item.target) {
        link.target = item.target;
        link.rel = item.rel || 'noopener noreferrer';
      }
      const iconMarkup = iconMap[item.icon] || '';
      link.innerHTML = `
        <span class="radial-menu-icon">${iconMarkup}</span>
        <span class="radial-menu-label">${item.label}</span>
      `;
      nav.appendChild(link);
    });
    links = Array.from(nav.querySelectorAll('.radial-menu-link'));
    attachLinkHandlers();
  }

  function attachLinkHandlers() {
    links.forEach(link => {
      link.addEventListener('click', () => {
        setTimeout(closeMenu, 300);
      });
    });
  }

  // Position menu items in radial pattern
  function positionMenuItems() {
    const radius = 120;
    const itemCount = links.length;
    if (!itemCount) {
      return;
    }
    
    links.forEach((link, index) => {
      const angleStep = 360 / itemCount;
      const angle = ((index * angleStep) - 90) * (Math.PI / 180); // Start from top
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;
      link.style.setProperty('--tx', `${x}px`);
      link.style.setProperty('--ty', `${y}px`);
    });
  }

  // Toggle menu open/close with animation
  function openMenu() {
    if (isOpen) {
      return;
    }
    isOpen = true;
    content.classList.add('active');
    toggle.classList.add('active');
  }

  function closeMenu() {
    if (!isOpen) {
      return;
    }
    isOpen = false;
    content.classList.remove('active');
    toggle.classList.remove('active');
  }

  function handleToggleClick(e) {
    e.preventDefault();
    e.stopPropagation();
    if (isOpen) {
      closeMenu();
    } else {
      openMenu();
    }
  }

  toggle.addEventListener('click', handleToggleClick);

  document.addEventListener('click', function(e) {
    if (!isOpen) {
      return;
    }
    if (!content.contains(e.target) && !toggle.contains(e.target)) {
      closeMenu();
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closeMenu();
    }
  });

  renderMenu(menuItems);
  positionMenuItems();
  window.addEventListener('resize', positionMenuItems);
});
</script>
